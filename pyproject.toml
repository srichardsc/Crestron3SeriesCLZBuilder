[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crestron-3series-clz-builder"
version = "1.0.0"
description = "Reproducible CLZ builder for Crestron 3-Series SIMPL# projects"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "srichardsc" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["Crestron", "CLZ", "SIMPL#", "3-Series", "reproducible-builds"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools"
]

[project.urls]
Homepage = "https://github.com/srichardsc/Crestron3SeriesCLZBuilder"
Repository = "https://github.com/srichardsc/Crestron3SeriesCLZBuilder"
Issues = "https://github.com/srichardsc/Crestron3SeriesCLZBuilder/issues"

[project.scripts]
crestron-clz = "crestron_clz_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
crestron_clz_builder = ["Signer.cs"]
