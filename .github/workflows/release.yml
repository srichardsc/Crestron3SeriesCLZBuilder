name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  executable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up public Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install package without proprietary dependencies
        shell: pwsh
        run: |
          python -m pip install --no-deps .
          python -m pip install pyinstaller

      - name: Build single-file executable
        shell: pwsh
        run: .\scripts\MakeExecutable.ps1

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $version = & .\dist-exe\clz-builder.exe --version
          Write-Host "smoke test: $version"
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist-exe\clz-builder.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clz-builder.exe" | Out-File -Encoding ascii .\dist-exe\clz-builder.exe.sha256
          Get-Content .\dist-exe\clz-builder.exe.sha256

      - name: Create GitHub Release with the executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create "$tag" `
            --title "$tag" `
            --notes "Standalone Windows build of this tag. Download **clz-builder.exe**, copy it next to your driver folder and run `clz-builder.exe setup` then `clz-builder.exe run`. Verify the download with clz-builder.exe.sha256 (SHA-256). Requires no Python; licensed Crestron toolchain must be installed on the host." `
            .\dist-exe\clz-builder.exe .\dist-exe\clz-builder.exe.sha256
